<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <title>LoveTrack</title>
  <!--
    The same lucide heart the app header and login page use, filled with the
    rose primary. No stroke and a slightly oversized path, so it still reads
    as a heart at 16px in a browser tab.
  -->
  <defs>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>
  <g transform="translate(12 12) scale(1.08) translate(-12 -12)">
    <path
      fill="url(#rose)"
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
    />
  </g>
</svg>
